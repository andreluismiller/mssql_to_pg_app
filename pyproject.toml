[project]
name = "mssql-to-pg-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "André Miller", email = "andreluismiller@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "pydantic>=2.14.3",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[project.scripts]
mssql-to-pg-app = "mssql_to_pg_app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]
